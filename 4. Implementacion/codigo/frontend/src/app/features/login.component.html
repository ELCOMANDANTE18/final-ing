<main class="auth-page">
  <section class="auth-card">
    <header class="auth-header">
      <span class="brand-mark" aria-hidden="true">U</span>
      <h1>Iniciar sesión</h1>
      <p class="muted">Entrá a tu cuenta de UMBook.</p>
    </header>

    <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>
      <label class="field">
        <span>Correo electrónico</span>
        <input name="email" type="email" [(ngModel)]="email" required autocomplete="email"
               placeholder="vos@ejemplo.com" />
      </label>

      <label class="field">
        <span>Contraseña</span>
        <input name="password" type="password" [(ngModel)]="password" required
               autocomplete="current-password" placeholder="Tu contraseña" />
      </label>

      <p class="alert alert-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

      <button class="btn btn-primary btn-block" type="submit" [disabled]="loading">
        {{ loading ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <p class="auth-switch">
      ¿No tenés cuenta?
      <button type="button" class="link" (click)="goToRegister()">Registrate</button>
    </p>
  </section>
</main>
