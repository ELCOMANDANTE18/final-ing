<main class="auth-page">
  <section class="auth-card">
    <header class="auth-header">
      <span class="brand-mark" aria-hidden="true">U</span>
      <h1>Crear cuenta</h1>
      <p class="muted">Sumate a UMBook en un minuto.</p>
    </header>

    <form (ngSubmit)="register()" #regForm="ngForm" novalidate>
      <label class="field">
        <span>Nombre</span>
        <input name="name" type="text" [(ngModel)]="name" required autocomplete="name"
               placeholder="Tu nombre completo" />
      </label>

      <label class="field">
        <span>Correo electrónico</span>
        <input name="email" type="email" [(ngModel)]="email" required autocomplete="email"
               placeholder="vos@ejemplo.com" />
      </label>

      <label class="field">
        <span>Contraseña</span>
        <input name="password" type="password" [(ngModel)]="password" required minlength="8"
               autocomplete="new-password" placeholder="Mínimo 8 caracteres" />
      </label>

      <p class="alert alert-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
      <p class="alert alert-success" *ngIf="successMessage" role="status">{{ successMessage }}</p>

      <button class="btn btn-primary btn-block" type="submit" [disabled]="loading">
        {{ loading ? 'Creando cuenta…' : 'Registrarse' }}
      </button>
    </form>

    <p class="auth-switch">
      ¿Ya tenés cuenta?
      <button type="button" class="link" (click)="goToLogin()">Iniciá sesión</button>
    </p>
  </section>
</main>
