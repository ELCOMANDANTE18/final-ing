<main class="page">
  <section class="hero">
    <p class="eyebrow">Pantalla principal</p>
    <h1>Hola{{ userName ? ', ' + userName : '' }} 👋</h1>
    <p>Bienvenido a UMBook. ¿Qué querés hacer?</p>
  </section>

  <section class="actions">
    <button type="button" class="action-card" (click)="goToInvite()">
      <span class="action-icon" aria-hidden="true">✉</span>
      <span class="action-text">
        <strong>Invitar amigos</strong>
        <span class="muted">Mandale un correo a alguien para que se sume a UMBook.</span>
      </span>
      <span class="action-arrow" aria-hidden="true">→</span>
    </button>

    <button type="button" class="action-card action-card-quiet" (click)="goToLogin()">
      <span class="action-icon" aria-hidden="true">⏻</span>
      <span class="action-text">
        <strong>Cerrar sesión</strong>
        <span class="muted">Salís de tu cuenta en este navegador.</span>
      </span>
      <span class="action-arrow" aria-hidden="true">→</span>
    </button>
  </section>
</main>
