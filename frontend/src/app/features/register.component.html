<div class="auth-shell">
  <div class="brand-panel">
    <div class="brand-mark">
      <span>U</span>
    </div>
    <h2>Sumate a<br />UMBook</h2>
    <p>Creá tu cuenta en un minuto y empezá a armar tu red de amigos.</p>
    <ul class="feature-list">
      <li><span class="check">✓</span> Registro rápido y simple</li>
      <li><span class="check">✓</span> Contraseñas siempre hasheadas</li>
      <li><span class="check">✓</span> Sin spam, sin vueltas</li>
    </ul>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Registrarme</h1>

      <p *ngIf="errorMessage" class="form-message error">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="form-message success">{{ successMessage }}</p>

      <form (ngSubmit)="submit()" #registerForm="ngForm">
        <label class="field">
          Nombre
          <input type="text" name="name" [(ngModel)]="name" required />
        </label>

        <label class="field">
          Email
          <input type="email" name="email" [(ngModel)]="email" required />
        </label>

        <label class="field">
          Contraseña
          <input type="password" name="password" [(ngModel)]="password" required minlength="8" />
        </label>

        <button type="submit" class="btn-primary">Registrarme</button>
      </form>

      <a routerLink="/login" class="switch-link">Ya tengo una cuenta</a>
    </div>
  </div>
</div>
